{% extends 'accounts/base.html' %}

{% block title %}TransitGo | Commuter Dashboard{% endblock %}

{% block content %}
<div class="w-full max-w-2xl bg-white border border-slate-200 rounded-3xl shadow-xl p-8 my-6">
    <div class="mb-6">
        <h1 class="text-3xl font-extrabold text-[#0f172a] tracking-tight">Commuter Dashboard</h1>
        <p class="text-slate-500 text-sm mt-1">WELCOME, <span class="font-bold text-[#102a43]">{{ user.username }}</span>!</p>
    </div>

    <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100 space-y-4">
        <h2 class="text-lg font-bold text-slate-800">Quick Actions</h2>
        <div class="grid grid-cols-2 gap-4">
            <a href="{% url 'profile' %}" class="p-4 bg-white border border-slate-200 rounded-xl hover:border-[#102a43] transition font-semibold text-sm text-center shadow-sm block">
                View Profile
            </a>
            <a href="{% url 'logout' %}" class="p-4 bg-rose-50 border border-rose-100 rounded-xl hover:bg-rose-100 transition font-semibold text-sm text-rose-700 text-center block">
                Sign Out
            </a>
        </div>
    </div>
</div>
{% endblock %}
