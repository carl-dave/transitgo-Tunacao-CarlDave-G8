{% extends 'accounts/base.html' %}

{% block title %}TransitGo | Profile{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-xl p-8 my-6">
    <div class="mb-6">
        <h1 class="text-3xl font-extrabold text-[#0f172a] tracking-tight">My Profile</h1>
        <p class="text-slate-500 text-sm mt-1">WELCOME, <span class="font-bold text-[#102a43]">{{ user.username }}</span>!</p>
    </div>

    <div class="space-y-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
        <div>
            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Username</span>
            <span class="text-sm font-semibold text-slate-800">{{ user.username }}</span>
        </div>
        <div>
            <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Email Address</span>
            <span class="text-sm font-semibold text-slate-800">{{ user.email|default:"No email provided" }}</span>
        </div>
    </div>


    <div class="mt-6">
        <a href="{% url 'login' %}" 
           class="w-full py-3 px-4 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-2xl transition duration-200 text-center block text-sm">
            Sign Out
        </a>
    </div>
</div>
{% endblock %}
