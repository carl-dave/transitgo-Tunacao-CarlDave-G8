<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TransitGo{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">

  
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
        <span class="font-bold text-lg text-slate-900 tracking-tight">TransitGo</span>
        <div class="space-x-4 text-sm font-medium">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="text-slate-600 hover:text-slate-900">Profile</a>
                <form method="post" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="text-rose-600 hover:underline font-semibold">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-slate-600 hover:text-slate-900">Login</a>
                <a href="{% url 'register' %}" class="bg-[#102a43] text-white px-4 py-2 rounded-xl hover:bg-[#1b365d] transition">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="flex items-center justify-center p-6 flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200">
        &copy; 2026 TransitGo. All rights reserved.
    </footer>

</body>
</html>
